name: AdProof local refresh recovery regression (MOCK Meta)

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/app.js'
      - 'public/factual-repair.js'
      - 'public/visual-consistency.js'
      - 'public/proof-studio.js'
      - 'public/repair-notice.js'
      - 'public/output-system.js'
      - 'public/consistency-ui.js'
      - 'scripts/factual-repair-browser.cjs'
      - 'public/app.html'
      - 'public/local-recovery.js'
      - 'public/i18n.js'
      - 'public/styles.css'
      - 'public/studio.css'
      - 'scripts/local-recovery-browser.cjs'
      - 'scripts/request-lifecycle-browser.cjs'
      - 'scripts/i18n-smoke.cjs'
      - 'scripts/style-browser.cjs'
      - 'scripts/ocr-repair-browser.cjs'
      - 'ocr-localization.mjs'
      - 'package-lock.json'
      - '.github/workflows/local-recovery-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency only
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local application without Meta credentials
        run: |
          node server.mjs >/tmp/adproof-server.log 2>&1 &
          echo $! >/tmp/adproof-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/app >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/adproof-server.log
          exit 1
      - name: Test access verification, session restore and request timer cleanup at six widths (MOCK API)
        run: node scripts/request-lifecycle-browser.cjs
      - name: Upload browser lifecycle evidence (not live Meta)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-lifecycle-browser-evidence
          path: qa-artifacts/request-lifecycle
          retention-days: 7
      - name: Test source-bound repair, caption, pixel locks and three ratio transitions (MOCK Meta)
        run: node scripts/factual-repair-browser.cjs
      - name: Test actual OCR geometry and photographic source pixel preservation (NO Meta calls)
        run: node scripts/ocr-repair-browser.cjs
      - name: Upload deterministic pixel evidence (not live Meta)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-bound-pixel-evidence
          path: qa-artifacts/source-bound
          retention-days: 7
      - name: Test recovery without paid provider calls
        run: node scripts/local-recovery-browser.cjs
      - name: Test automatic language and unchanged report evidence at six widths (MOCK Meta)
        run: node scripts/i18n-smoke.cjs
      - name: Replay recorded Meta style reports through comparison and actual PNG export (NO fresh inference)
        run: node scripts/style-browser.cjs
      - name: Upload recorded style replay evidence (not fresh Meta)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-style-browser-evidence
          path: qa-artifacts/style-replay
          retention-days: 7
      - name: Upload safe diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-recovery-server-logs
          path: /tmp/adproof-server.log
          retention-days: 3
