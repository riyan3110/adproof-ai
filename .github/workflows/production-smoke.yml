name: AdProof AI production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production pages and API health
        shell: bash
        run: |
          set -euo pipefail
          origin="https://adproof-ai.vercel.app"
          paths=("/" "/app" "/docs" "/styles.css" "/app.js" "/api/health")
          for path in "${paths[@]}"; do
            echo "::group::GET $path"
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl -sS --max-time 15 -L -o /tmp/adproof-response -w '%{http_code}' "$origin$path" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "Attempt $attempt: HTTP $code"
              sleep 4
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::GET $path returned $code instead of 200"
              head -c 300 /tmp/adproof-response || true
              exit 1
            fi
            if [ "$path" = "/" ] || [ "$path" = "/app" ] || [ "$path" = "/docs" ]; then
              if ! grep -qi 'AdProof' /tmp/adproof-response; then
                echo "::error::GET $path returned 200 but missing AdProof HTML content"
                exit 1
              fi
            fi
            if [ "$path" = "/api/health" ]; then
              python3 -c 'import json; p=json.load(open("/tmp/adproof-response")); assert p.get("ok") is True, p; print("API health OK (key state not printed)")'
            fi
            echo "GET $path returned 200 with expected content"
            echo "::endgroup::"
          done
          echo "✅ Public pages and non-billable API health succeeded." >> "$GITHUB_STEP_SUMMARY"
