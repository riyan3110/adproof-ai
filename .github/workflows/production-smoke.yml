name: AdProof AI production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production pages and API health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # Wait for the existing deployment; never create one here.
          # A stale build returning 200 must not pass for a newer checkout.
          ok=0
          for attempt in $(seq 1 6); do
            if node scripts/production-smoke.mjs; then ok=1; break; fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
          echo "Asset hashes match this checkout; health and missing/invalid-code rejection passed. No live Meta calls." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish smoke result as GitHub commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.verify.outcome }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "$CHECK_OUTCOME" = "success" ]; then state="success"; description="Production assets match checkout; access gate verified"; else state="failure"; description="Production smoke failed; inspect GitHub Actions"; fi
          gh api --method POST "repos/$REPOSITORY/statuses/$SHA" -f state="$state" -f context="adproof-production-smoke" -f description="$description"
