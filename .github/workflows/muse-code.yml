name: Muse Code - AdProof AI

# Mobile-friendly: opening an owner-authored Issue with a [muse] title runs Muse Code.
# A successful run proposes changes as a pull request. It NEVER auto-merges.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: muse-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  muse:
    if: github.event.issue.user.login == 'riyan3110' && startsWith(github.event.issue.title, '[muse] ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the current project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Check Meta API secret
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        shell: bash
        run: |
          if [ -z "$META_API_KEY" ]; then
            echo "::error::Set repository secret META_API_KEY before opening a [muse] Issue."
            exit 1
          fi

      - name: Install official Meta Muse Code CLI
        shell: bash
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/muse" --version

      - name: Prepare task safely
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          title = os.environ.get("ISSUE_TITLE", "")[7:500]
          body = os.environ.get("ISSUE_BODY", "")[:5000]
          instructions = """You are the official Meta Muse Code agent working on AdProof AI for the Meta Global AI Developer Hackathon.
          Act only in this checked-out repository. Do not modify GitHub workflows, secrets, credentials, environment configuration, or files outside the workspace.
          Never print or copy API keys or sensitive environment variables into files, logs or output.
          Preserve the existing UI style: visual-first dark premium, minimal words in the app, long explanations in /docs.
          Implement one focused requested task. Maintain the real Meta API integration, not a simulated production result.
          Run npm run check when feasible. Provide a brief summary of modifications and any limitations.
          Requested task:
          """
          Path("/tmp/adproof-muse-task.txt").write_text(instructions + "\n" + title + "\n" + body + "\n", encoding="utf-8")
          PY

      - name: Run real Muse Code (sandboxed, bounded)
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        shell: bash
        run: |
          muse exec --trust-workspace --disable-approval --max-model-steps 12 --prompt-file /tmp/adproof-muse-task.txt

      - name: Validate result
        id: tests
        continue-on-error: true
        shell: bash
        run: npm run check

      - name: Push review branch and propose pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          set -eu
          branch="muse/issue-${ISSUE_NUMBER}-run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # Never publish secrets, local env files, or workflow edits generated by the agent.
          git add -A -- . ':!.github/workflows' ':!.env' ':!**/.env' ':!**/.env.*' ':!**/node_modules' ':!**/node_modules/**' ':!**/.muse/**'
          if git diff --cached --quiet; then
            echo "Muse Code finished without file changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "feat: Meta Muse Code contribution for issue #${ISSUE_NUMBER}"
          git push origin "$branch"
          echo "Muse Code changes pushed to branch $branch. Tests: ${TESTS_OUTCOME}." >> "$GITHUB_STEP_SUMMARY"
          if [ "$TESTS_OUTCOME" = "success" ]; then
            title="Muse Code: AdProof AI task #${ISSUE_NUMBER}"
            flags=""
          else
            title="Muse Code: AdProof AI task #${ISSUE_NUMBER} (tests need review)"
            flags="--draft"
          fi
          if gh pr create $flags --base main --head "$branch" --title "$title" --body "Created by **Meta Muse Code** from issue #${ISSUE_NUMBER}.\n\nValidation: ${TESTS_OUTCOME}.\n\nReview the changes before merging. This is not proof of hackathon eligibility by itself."; then
            echo "Review the proposed PR; it has NOT been merged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR creation was unavailable. The branch is preserved for manual review." >> "$GITHUB_STEP_SUMMARY"
          fi
